name: Update dashboard data

on:
  schedule:
    # Runs 4x/day, UTC: 00:00, 06:00, 12:00, 18:00
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch: {}
    # ^ this is what gives you the manual "Run workflow" button in the
    #   Actions tab on GitHub — click it any time to force an update now.

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Pull latest sheet data
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/update_data.py

      - name: Commit and push if data changed
        run: |
          git config user.name "credits-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data.js; then
            echo "No changes to data.js — nothing to commit."
          else
            git add data.js
            git commit -m "Auto-update dashboard data"
            git push
          fi
